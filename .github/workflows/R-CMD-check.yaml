name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # `mlr3proba`, `mlr3extralearners`, and `uniml` are not on CRAN, so they
      # are installed from GitHub before the declared dependencies are resolved.
      # The minimum `uniml` version is read from DESCRIPTION rather than copied
      # here, because a stale copy silently installs an uniml this package cannot
      # use.
      - name: Install GitHub-only dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck", "pak"))
          remotes::install_github(
            c("mlr-org/mlr3proba", "mlr-org/mlr3extralearners"),
            upgrade = "never",
            dependencies = TRUE
          )
          remotes::install_github(
            "zhengyangszy/uniml",
            upgrade = "always",
            dependencies = TRUE
          )
          imports <- read.dcf("DESCRIPTION")[1, "Imports"]
          needed <- sub(
            ".*uniml \\(>= ([0-9.]+)\\).*", "\\1", imports
          )
          have <- as.character(packageVersion("uniml"))
          if (utils::compareVersion(have, needed) < 0) {
            stop(
              "uniml ", have, " is too old for this check; ",
              "DESCRIPTION requires ", needed, "."
            )
          }
          cat("uniml", have, "satisfies >=", needed, "\n")
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
