name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # The GitHub-only dependencies go in *after* the resolver, and last, so
      # nothing installs an older copy on top of them. Order matters here: the
      # resolver used to overwrite `uniml` with a cached build, which made the
      # check run against an API this package does not have.
      - name: Install GitHub-only dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck", "pak"))
          remotes::install_github(
            c("mlr-org/mlr3proba", "mlr-org/mlr3extralearners"),
            upgrade = "never",
            dependencies = TRUE
          )
          remotes::install_github(
            "zhengyangszy/uniml",
            upgrade = "always",
            dependencies = TRUE
          )
          imports <- read.dcf("DESCRIPTION")[1, "Imports"]
          needed <- sub(".*uniml \\(>= ([0-9.]+)\\).*", "\\1", imports)
          have <- as.character(packageVersion("uniml"))
          where <- dirname(find.package("uniml"))
          cat("uniml", have, "from", where, "\n")
          if (utils::compareVersion(have, needed) < 0) {
            stop(
              "uniml ", have, " is too old for this check; ",
              "DESCRIPTION requires ", needed, "."
            )
          }
          # Behaviour, not just the version string: the no-selection path is what
          # the survival workflow relies on.
          probe <- tryCatch(
            {
              spec <- uniml::uniml_spec("binary", "y", "1")
              spec$selection$methods <- character()
              uniml::select_features(
                data.frame(y = factor(c("a", "b")), x = c(1, 2)),
                spec
              )
              TRUE
            },
            error = function(e) conditionMessage(e)
          )
          if (!isTRUE(probe)) {
            stop("uniml cannot keep every feature: ", probe)
          }
          cat("uniml no-selection path ok\n")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
